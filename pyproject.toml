[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "int_design"
version = "0.1.0"
description = "Room Designer Streamlit application using local assets."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
dependencies = [
    "streamlit>=1.37,<2.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "plotly>=5.0",
    "jupyter>=1.0",
    "requests>=2.28",
    "beautifulsoup4>=4.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
